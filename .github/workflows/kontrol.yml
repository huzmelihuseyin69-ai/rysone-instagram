name: Hesap kontrolü

on:
  workflow_dispatch:

jobs:
  kontrol:
    runs-on: ubuntu-latest
    env:
      T: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - run: |
          G=https://graph.instagram.com/v23.0
          echo "== Aktif hikâyeler"; curl -sS "$G/me/stories?fields=id,media_type,timestamp,permalink&access_token=$T"; echo
          echo "== Son medyalar"; curl -sS "$G/me/media?fields=id,media_product_type,timestamp,permalink&limit=5&access_token=$T"; echo
          echo "== 22 Eki hikâye id"; curl -sS "$G/17997927548834057?fields=id,media_product_type,timestamp,permalink&access_token=$T"; echo
