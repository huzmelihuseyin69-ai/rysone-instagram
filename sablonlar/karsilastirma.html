<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/base.css"><style>
  .tag { text-align: center; }
  h1 { margin-top: 20px; text-align: center; font-weight: 700; font-size: 80px; line-height: 1.1; letter-spacing: -1.5px; }
  .cols { margin-top: 64px; display: grid; grid-template-columns: 1fr 1fr; gap: 26px; }
  .col { border-radius: 40px; padding: 38px 30px 40px; }
  .col h3 { font-size: 32px; font-weight: 700; margin-bottom: 28px; }
  .col ul { list-style: none; display: flex; flex-direction: column; gap: 24px; }
  .col li { display: flex; gap: 14px; font-size: 26px; line-height: 1.35; }
  .col li::before { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
                    font-size: 22px; font-weight: 700; margin-top: 1px; }
  .eski { background: var(--soft); border: 2px solid var(--line); color: var(--muted); }
  .eski h3 { color: var(--fg); opacity: .75; }
  .eski li::before { content: "✕"; background: rgba(226,76,76,.14); color: #E24C4C; }
  .yeni { background: var(--card); color: var(--card-fg); box-shadow: 0 30px 60px rgba(20,30,80,.18); }
  .tema-gece .yeni { background: linear-gradient(160deg, #2459E8, #6B4BF0); color: #fff; }
  .yeni h3 { color: #2459E8; }
  .tema-gece .yeni h3 { color: #fff; }
  .yeni li::before { content: "✓"; background: rgba(34,160,107,.15); color: #22A06B; }
  .tema-gece .yeni li::before { background: rgba(255,255,255,.2); color: #fff; }
  .btn { margin-top: 64px; }
  .foot { margin-top: auto; padding-top: 60px; }
</style></head>
<body class="tema-{{tema}}"><div class="glow"></div>
  <div class="tag ust">{{etiket}}</div>
  <h1>{{baslik}}</h1>
  <div class="cols">
    <div class="col eski"><h3>{{sol_baslik}}</h3><ul>{{sol_maddeler}}</ul></div>
    <div class="col yeni"><h3>{{sag_baslik}}</h3><ul>{{sag_maddeler}}</ul></div>
  </div>
  <div class="btn">{{buton}} &nbsp;→</div>
  <div class="foot"><img src="../assets/{{logo}}.png"><div class="line"></div><span>{{site}}</span></div>
</body></html>
