<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/base.css"><style>
  body { align-items: stretch; }
  h1 { margin-top: 30px; text-align: center; font-weight: 700; font-size: 72px; line-height: 1.1; letter-spacing: -1.5px; }
  .card { margin-top: 44px; background: var(--card); color: var(--card-fg); border-radius: 44px;
          box-shadow: 0 40px 80px rgba(20,30,80,.16); overflow: hidden; }
  .tema-gece .card { border: 2px solid var(--line); }
  .head { display: flex; align-items: center; gap: 20px; padding: 24px 34px; border-bottom: 2px solid rgba(120,130,170,.15); }
  .av { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #2459E8, #7C5CFF);
        display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 30px; flex: none; }
  .who b { display: block; font-size: 27px; font-weight: 600; }
  .who span { font-size: 21px; color: #22A06B; font-weight: 500; }
  .msgs { padding: 26px 28px 30px; display: flex; flex-direction: column; gap: 16px; }
  .m { max-width: 82%; padding: 18px 24px; border-radius: 28px; font-size: 25px; line-height: 1.38; }
  .m.musteri { align-self: flex-start; background: #EEF1F8; color: #12162B; border-bottom-left-radius: 8px; }
  .m.asistan { align-self: flex-end; background: #2459E8; color: #fff; border-bottom-right-radius: 8px; }
  .tema-gece .m.musteri { background: #232B5E; color: #fff; }
  .m small { display: block; font-size: 18px; opacity: .6; margin-top: 4px; text-align: right; }
  .sub { margin-top: 40px; text-align: center; font-size: 29px; line-height: 1.42; color: var(--muted); }
  .sub b { color: var(--fg); font-weight: 600; }
  .btn { margin-top: 34px; }
</style></head>
<body class="tema-{{tema}}"><div class="glow"></div>
  <div class="badge">{{rozet}}</div>
  <h1>{{baslik}}<br><span class="grad-text">{{vurgu}}</span></h1>
  <div class="card">
    <div class="head"><div class="av">R</div><div class="who"><b>{{asistan_adi}}</b><span>● {{durum}}</span></div></div>
    <div class="msgs">{{mesajlar}}</div>
  </div>
  <div class="sub">{{alt_metin}}</div>
  <div class="btn">{{buton}} &nbsp;→</div>
  <div class="foot center"><img src="../assets/{{logo}}.png"></div>
</body></html>
