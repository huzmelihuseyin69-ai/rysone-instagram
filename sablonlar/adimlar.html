<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/base.css"><style>
  h1 { margin-top: 20px; font-weight: 700; font-size: 84px; line-height: 1.08; letter-spacing: -1.5px; }
  .steps { margin-top: 70px; display: flex; flex-direction: column; gap: 0; position: relative; }
  .s { display: flex; gap: 34px; position: relative; padding-bottom: 46px; }
  .s:not(:last-child)::after { content: ""; position: absolute; left: 41px; top: 90px; bottom: 6px; width: 3px;
                               background: var(--line); border-radius: 2px; }
  .num { width: 84px; height: 84px; border-radius: 50%; flex: none; display: grid; place-items: center;
         font-size: 34px; font-weight: 700; background: linear-gradient(135deg, #2459E8, #7C5CFF); color: #fff;
         box-shadow: 0 14px 30px rgba(60,80,230,.30); }
  .tema-mavi .num, .tema-mor .num { background: #fff; color: #2459E8; box-shadow: 0 14px 30px rgba(8,20,90,.25); }
  .s b { display: block; font-size: 36px; font-weight: 600; margin-top: 8px; }
  .s p { font-size: 28px; line-height: 1.4; color: var(--muted); margin-top: 6px; }
  .btn { align-self: flex-start; margin-top: 20px; }
</style></head>
<body class="tema-{{tema}}"><div class="glow"></div>
  <div class="tag ust">{{etiket}}</div>
  <h1>{{baslik}}</h1>
  <div class="steps">{{adimlar}}</div>
  <div class="btn">{{buton}} &nbsp;→</div>
  <div class="foot"><img src="../assets/{{logo}}.png"><div class="line"></div><span>{{site}}</span></div>
</body></html>
