<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/base.css"><style>
  h1 { margin-top: 20px; font-weight: 700; font-size: 82px; line-height: 1.08; letter-spacing: -1.5px; }
  h1 span { display: block; }
  .chips { margin-top: 60px; display: flex; flex-wrap: wrap; gap: 16px; }
  .chips li { list-style: none; padding: 16px 28px; border-radius: 999px; font-size: 28px; font-weight: 500;
              background: var(--soft); border: 2px solid var(--line); }
  .tema-acik .chips li { background: #fff; border-color: #E3E7F2; }
  .chips li:nth-child(3n+1) { background: #2459E8; color: #fff; border-color: #2459E8; }
  .tema-mavi .chips li:nth-child(3n+1), .tema-mor .chips li:nth-child(3n+1) { background: #fff; color: #2459E8; border-color: #fff; }
  .sub { margin-top: 56px; font-size: 32px; line-height: 1.42; color: var(--muted); }
  .sub b { color: var(--fg); font-weight: 600; }
  .btn { align-self: flex-start; margin-top: 44px; }
</style></head>
<body class="tema-{{tema}}"><div class="glow"></div>
  <div class="tag ust">{{etiket}}</div>
  <h1><span>{{baslik}}</span><span class="grad-text">{{vurgu}}</span></h1>
  <ul class="chips">{{etiketler}}</ul>
  <div class="sub">{{alt_metin}}</div>
  <div class="btn">{{buton}} &nbsp;→</div>
  <div class="foot"><img src="../assets/{{logo}}.png"><div class="line"></div><span>{{site}}</span></div>
</body></html>
