<!doctype html><html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/base.css"><style>
  .card { margin-top: 50px; background: var(--card); color: var(--card-fg); border-radius: 48px; padding: 56px 56px 60px;
          box-shadow: 0 40px 80px rgba(20,30,80,.16); position: relative; }
  .tema-gece .card { border: 2px solid var(--line); }
  .lab { display: inline-flex; align-items: center; gap: 14px; font-size: 26px; font-weight: 700; letter-spacing: 3px;
         color: #2459E8; background: rgba(36,89,232,.10); padding: 12px 24px; border-radius: 999px; }
  .tema-gece .lab { color: #A9BCFF; background: rgba(91,130,255,.16); }
  .lab svg { width: 30px; height: 30px; }
  .card h1 { margin-top: 38px; font-size: 70px; font-weight: 700; line-height: 1.1; letter-spacing: -1.2px; }
  .card p { margin-top: 30px; font-size: 32px; line-height: 1.5; opacity: .78; }
  .card p b { opacity: 1; font-weight: 600; }
  .big-n { position: absolute; right: 44px; top: 20px; font-family: 'Anton', sans-serif; font-size: 170px; line-height: 1;
           color: rgba(36,89,232,.08); }
  .tema-gece .big-n { color: rgba(255,255,255,.06); }
  .note { margin-top: 60px; display: flex; align-items: center; gap: 22px; font-size: 30px; line-height: 1.4; color: var(--muted); }
  .note b { color: var(--fg); font-weight: 600; }
  .note i { width: 56px; height: 56px; border-radius: 50%; flex: none; display: grid; place-items: center; font-style: normal;
            background: linear-gradient(135deg, #2459E8, #7C5CFF); color: #fff; font-weight: 700; font-size: 26px; }
  .tema-mavi .note i, .tema-mor .note i { background: #fff; color: #2459E8; }
</style></head>
<body class="tema-{{tema}}"><div class="glow"></div>
  <div class="tag ust">{{etiket}}</div>
  <div class="card">
    <div class="big-n">{{no}}</div>
    <div class="lab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>İPUCU {{no}}</div>
    <h1>{{baslik}}</h1>
    <p>{{metin}}</p>
  </div>
  <div class="note"><i>R</i><span>{{not}}</span></div>
  <div class="foot"><img src="../assets/{{logo}}.png"><div class="line"></div><span>{{site}}</span></div>
</body></html>
